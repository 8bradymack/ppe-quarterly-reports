name: Send Quarterly PPE Report

on:
  schedule:
    # Runs at midnight (UTC) on the 1st day of January, May, and September
    # That's every 4 months: Jan 1, May 1, Sep 1
    - cron: '1 7 2 11 *'
  
  # Allows you to manually trigger the workflow from the Actions tab (for testing)
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install node-fetch@2 xlsx @sendgrid/mail
      
      - name: Generate and send report
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: node generate-report.js
